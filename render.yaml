# emo_tune_api\render.yaml

services:
  - type: web
    name: emotune-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /health
